name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: AlgoRemix-Windows
          - name: macOS
            os: macos-latest
            artifact: AlgoRemix-macOS
          - name: Linux
            os: ubuntu-24.04
            artifact: AlgoRemix-Linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libgl1-mesa-dev xvfb

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DALGOREMIX_BUILD_TOOLS=ON
          elif [ "$RUNNER_OS" = "Linux" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DALGOREMIX_BUILD_TOOLS=ON
          else
            cmake -S . -B build -G Xcode -DALGOREMIX_BUILD_TOOLS=ON
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Render test
        shell: bash
        run: |
          VST3="build/AlgoRemix_artefacts/Release/VST3/AlgoRemix.vst3"
          RT=$(find build -type f \( -name AlgoRemixRenderTest -o -name AlgoRemixRenderTest.exe \) -path "*Release*" | head -1)
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "$RT" "$VST3" render.wav 100 0
          else
            "$RT" "$VST3" render.wav 100 0
          fi

      - name: pluginval
        shell: bash
        run: |
          VST3="$PWD/build/AlgoRemix_artefacts/Release/VST3/AlgoRemix.vst3"
          case "$RUNNER_OS" in
            Windows) curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip; PV=./pluginval.exe ;;
            macOS)   curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip; PV=./pluginval.app/Contents/MacOS/pluginval ;;
            Linux)   curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip; PV="xvfb-run -a ./pluginval" ;;
          esac
          unzip -q -o pv.zip
          $PV --strictness-level 5 --validate-in-process --skip-gui-tests --timeout-ms 600000 "$VST3"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -R build/AlgoRemix_artefacts/Release/VST3/AlgoRemix.vst3 dist/
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R build/AlgoRemix_artefacts/Release/AU/AlgoRemix.component dist/ || true
          fi
          cp README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
